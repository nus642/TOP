<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pickle球 场地全景动态调度看板</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23a3e635'/%3E%3Ccircle cx='50' cy='20' r='7' fill='%231e293b' opacity='0.4'/%3E%3Ccircle cx='30' cy='32' r='7' fill='%231e293b' opacity='0.4'/%3E%3Ccircle cx='70' cy='32' r='7' fill='%231e293b' opacity='0.4'/%3E%3Ccircle cx='18' cy='55' r='7' fill='%231e293b' opacity='0.4'/%3E%3Ccircle cx='82' cy='55' r='7' fill='%231e293b' opacity='0.4'/%3E%3Ccircle cx='35' cy='75' r='7' fill='%231e293b' opacity='0.4'/%3E%3Ccircle cx='65' cy='75' r='7' fill='%231e293b' opacity='0.4'/%3E%3Ccircle cx='50' cy='50' r='7' fill='%231e293b' opacity='0.4'/%3E%3Ccircle cx='50' cy='85' r='7' fill='%231e293b' opacity='0.4'/%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: white; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .input-base { background: #1e293b; border: 1px solid #334155; padding: 0.75rem; border-radius: 0.5rem; color: white; width: 100%; outline: none; font-size: 0.875rem; transition: border-color 0.2s; }
        .input-base:focus { border-color: #10b981; }
        
        .kanban-scroll::-webkit-scrollbar { height: 10px; width: 8px; }
        .kanban-scroll::-webkit-scrollbar-track { background: #0f172a; }
        .kanban-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .kanban-scroll::-webkit-scrollbar-thumb:hover { background: #475569; }

        .task-card { cursor: grab; transition: transform 0.1s, box-shadow 0.1s; }
        .task-card:active { cursor: grabbing; transform: scale(0.98); }
        .task-card.dragging { opacity: 0.5; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 2px dashed #10b981; }
        .drop-zone { transition: background-color 0.2s; min-height: 150px; }
        .drop-zone.drag-over { background-color: rgba(16, 185, 129, 0.1); box-shadow: inset 0 0 10px rgba(16, 185, 129, 0.2); border-radius: 0.5rem; }

        .hidden-panel { display: none !important; }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #10b981; color: white; padding: 0.75rem 1.5rem; border-radius: 2rem; font-weight: bold; z-index: 9999; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .filter-group { display: flex; align-items: center; gap: 0.5rem; background: #1e293b; padding: 0.25rem 0.75rem; border-radius: 0.5rem; border: 1px solid #334155; }
        .filter-group select, .filter-group input { background: transparent; border: none; color: white; font-size: 0.75rem; outline: none; padding: 0.25rem 0; }
        .filter-group select { color: #fbbf24; font-weight: 700; }
        .filter-group input::placeholder { color: #64748b; }
        .filter-group span { color: #94a3b8; font-size: 0.7rem; }
    </style>
</head>
<body>

    <div id="loginPanel" class="flex-grow flex items-center justify-center p-4">
        <div class="bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-2xl max-w-sm w-full text-center relative overflow-hidden">
            <div class="absolute top-0 right-0 bg-blue-600 text-white text-[9px] font-black px-3 py-1 rounded-bl-xl shadow-md border-b border-l border-blue-400/50 tracking-wider">OBS 导播专用</div>
            <h2 class="text-2xl font-black mb-2 text-blue-400 mt-4">全景场地调度大盘</h2>
            <p class="text-xs text-slate-400 mb-6">Kanban Board for Directors</p>
            <input type="text" id="eventCodeInput" class="input-base mb-6 text-center uppercase tracking-widest font-bold text-emerald-300" placeholder="赛事识别码 (如: PICKLE01)">
            <button onclick="doLogin()" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-lg font-bold shadow-lg transition-colors text-white active:scale-95">🌍 接入全局雷达</button>
        </div>
    </div>

    <div id="mainApp" class="hidden-panel flex flex-col h-screen">
        
        <header class="bg-slate-900 border-b border-slate-800 p-4 flex flex-wrap justify-between items-center shrink-0 shadow-md relative z-20 gap-2">
            <div>
                <h1 class="text-xl font-black text-blue-400 flex items-center gap-2">
                    <span>🌍</span> 场地全景动态调度看板 
                    <span id="dispCode" class="text-xs bg-slate-800 text-emerald-400 font-mono px-2 py-1 rounded border border-slate-700 ml-2"></span>
                </h1>
                <div class="text-[10px] text-slate-400 mt-1 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    实时数据链路已接通 · 拖拽卡片即可极速换场
                </div>
            </div>
            <div class="flex items-center gap-3 flex-wrap">
                <div class="filter-group">
                    <span>📅</span>
                    <select id="dateFilter" onchange="renderBoard()">
                        <option value="">全部赛程</option>
                    </select>
                </div>
                <div class="filter-group">
                    <span>🔍</span>
                    <input type="text" id="searchFilter" oninput="renderBoard()" placeholder="队伍/编号..." class="w-28">
                </div>
                <button onclick="forceRefresh()" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 px-4 py-2 rounded-lg text-xs font-bold text-white transition-colors active:scale-95">🔄 手动刷新</button>
                <button onclick="logout()" class="text-[11px] text-red-400 hover:text-red-300 underline underline-offset-4 ml-2">退出连接</button>
            </div>
        </header>

        <main class="flex-grow flex gap-4 p-4 overflow-x-auto kanban-scroll items-start bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-800 to-slate-900">
            
            <div class="w-80 shrink-0 flex flex-col bg-slate-800/80 rounded-2xl border border-indigo-500/30 shadow-xl h-full max-h-full">
                <div class="p-3 border-b border-indigo-500/20 bg-indigo-900/30 rounded-t-2xl flex justify-between items-center shrink-0">
                    <h3 class="font-black text-indigo-300 flex items-center gap-1"><span>📥</span> 待办调度池</h3>
                    <span id="poolCount" class="text-xs font-bold bg-indigo-950 text-indigo-400 px-2 py-0.5 rounded border border-indigo-500/50 shadow-inner">0</span>
                </div>
                <div id="col-pool" class="flex-grow overflow-y-auto kanban-scroll p-2 drop-zone flex flex-col gap-2" ondrop="drop(event, '')" ondragover="allowDrop(event)">
                </div>
            </div>

            <div id="courtsContainer" class="flex gap-4 items-start h-full max-h-full">
            </div>

        </main>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const API = '/data.php';
        let eventCode = '';
        let globalData = { courts: {}, tasks: {} };
        let refreshInterval = null;
        let isDragging = false;

        // ======================== 安全加固的登录与恢复 ========================
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            // 优先从 sessionStorage 恢复
            let code = sessionStorage.getItem('pickle_master_code');
            if (!code) {
                code = urlParams.get('code');
                if (code) {
                    sessionStorage.setItem('pickle_master_code', code.toUpperCase());
                }
            }
            if (code) {
                document.getElementById('eventCodeInput').value = code;
                // 清除 URL 参数
                if (window.history && window.history.replaceState) {
                    const url = new URL(window.location);
                    url.searchParams.delete('code');
                    window.history.replaceState({}, document.title, url.toString());
                }
                // 自动登录
                setTimeout(doLogin, 100);
            }
        };

        window.doLogin = () => {
            const code = document.getElementById('eventCodeInput').value.trim().toUpperCase();
            if (!code) return alert('请输入赛事码！');
            eventCode = code;
            sessionStorage.setItem('pickle_master_code', code);
            
            // 清除 URL 参数
            if (window.history && window.history.replaceState) {
                const url = new URL(window.location);
                url.searchParams.delete('code');
                window.history.replaceState({}, document.title, url.toString());
            }

            document.getElementById('loginPanel').classList.add('hidden-panel');
            document.getElementById('mainApp').classList.remove('hidden-panel');
            document.getElementById('dispCode').innerText = code;
            
            fetchDashboardData();
            if (refreshInterval) clearInterval(refreshInterval);
            refreshInterval = setInterval(fetchDashboardData, 5000);
        };

        window.logout = () => {
            clearInterval(refreshInterval);
            sessionStorage.removeItem('pickle_master_code');
            location.reload();
        };

        window.forceRefresh = () => {
            if(isDragging) return showToast('拖拽操作中，已暂停刷新', true);
            fetchDashboardData();
            showToast('✅ 数据已手动同步');
        };

        function showToast(msg, isError = false) { 
            const t = document.getElementById('toast'); 
            t.innerText = msg; 
            t.style.background = isError ? '#dc2626' : '#10b981'; 
            t.style.display = 'block'; 
            setTimeout(() => t.style.display='none', 3000); 
        }

        async function fetchDashboardData() {
            if (isDragging) return;
            try {
                const res = await fetch(`${API}?action=get_full_dashboard&event_code=${eventCode}&_t=${Date.now()}`);
                const data = await res.json();
                if (data.status === 'success') {
                    globalData = data;
                    renderBoard();
                }
            } catch (e) { console.warn("后台拉取延时"); }
        }

        function createMatchCardHTML(task) {
            let dateTag = '';
            if (task.date) {
                dateTag = `<span class="bg-slate-700 text-slate-300 px-1.5 py-0.5 rounded text-[9px] mr-1">${task.date}</span>`;
            }

            let statusColor = 'bg-slate-700 text-slate-400';
            if (task.status === '比赛中') statusColor = 'bg-emerald-900 border border-emerald-500/50 text-emerald-400 animate-pulse shadow-[0_0_10px_rgba(16,185,129,0.2)]';
            if (task.status === '已完赛') statusColor = 'bg-blue-900 border border-blue-500/50 text-blue-400';

            return `
            <div class="task-card bg-slate-800 p-3 rounded-xl border border-slate-600 shadow-md hover:border-blue-400 hover:shadow-lg relative overflow-hidden group" 
                 id="card_${task.id}" 
                 draggable="true" 
                 ondragstart="dragStart(event, '${task.id}')" 
                 ondragend="dragEnd(event)">
                 
                <div class="flex justify-between items-start mb-2">
                    <div class="font-black text-amber-400 text-sm tracking-widest">${task.id}</div>
                    <div class="text-[10px] px-2 py-0.5 rounded font-bold ${statusColor}">${task.status || '待命'}</div>
                </div>
                
                <div class="text-xs font-bold text-white mb-1 truncate">${task.t1}</div>
                <div class="text-[10px] text-slate-500 italic mb-1 pl-2 border-l-2 border-slate-600">vs</div>
                <div class="text-xs font-bold text-white mb-2 truncate">${task.t2}</div>
                
                <div class="flex justify-between items-end border-t border-slate-700/50 pt-2 mt-2">
                    <div class="flex items-center">
                        ${dateTag}
                        <span class="text-[10px] text-slate-400">${task.format === 3 ? '三局两胜' : '单局制'}</span>
                    </div>
                    ${task.live_score ? `<span class="text-emerald-400 font-mono font-black text-sm drop-shadow-md">${task.live_score}</span>` : ''}
                </div>
            </div>`;
        }

        function renderBoard() {
            if (isDragging) return;

            let dates = new Set();
            Object.values(globalData.tasks || {}).forEach(t => {
                if (t.date) dates.add(t.date);
            });
            let dateSelect = document.getElementById('dateFilter');
            let currentVal = dateSelect.value;
            dateSelect.innerHTML = '<option value="">全部赛程</option>';
            let sortedDates = Array.from(dates).sort();
            sortedDates.forEach(d => {
                let opt = document.createElement('option');
                opt.value = d;
                opt.textContent = d;
                if (d === currentVal) opt.selected = true;
                dateSelect.appendChild(opt);
            });
            if (currentVal && !dates.has(currentVal)) {
                dateSelect.value = '';
            }

            let filterText = document.getElementById('searchFilter').value.trim().toLowerCase();
            let selectedDate = dateSelect.value;

            let allTasks = Object.values(globalData.tasks || {});
            
            if (selectedDate) {
                allTasks = allTasks.filter(t => t.date === selectedDate);
            }
            if (filterText) {
                allTasks = allTasks.filter(t => 
                    t.id.toLowerCase().includes(filterText) || 
                    t.t1.toLowerCase().includes(filterText) || 
                    t.t2.toLowerCase().includes(filterText) ||
                    (t.date && t.date.toLowerCase().includes(filterText))
                );
            }

            let poolTasks = [];
            let courtTasksMap = {};
            
            for(let c in globalData.courts) {
                courtTasksMap[c] = [];
            }

            allTasks.forEach(t => {
                if (!t.court || String(t.court).trim() === '') {
                    poolTasks.push(t);
                } else {
                    if (!courtTasksMap[t.court]) courtTasksMap[t.court] = [];
                    courtTasksMap[t.court].push(t);
                }
            });

            document.getElementById('poolCount').innerText = poolTasks.length;
            document.getElementById('col-pool').innerHTML = poolTasks.map(createMatchCardHTML).join('');

            let courtsHtml = '';
            for(let c in globalData.courts) {
                let info = globalData.courts[c];
                let isLive = info.status === '比赛中';
                let cTasks = courtTasksMap[c] || [];

                let headerClass = isLive 
                    ? 'bg-emerald-900/40 border-b border-emerald-500/50' 
                    : 'bg-slate-800/80 border-b border-slate-700';
                
                let liveInfoHtml = isLive ? `
                    <div class="mt-2 pt-2 border-t border-emerald-500/20">
                        <div class="text-[10px] text-emerald-200 truncate mb-1">${info.match_name || '自由匹配'}</div>
                        <div class="text-xl font-black text-emerald-400 font-mono tracking-wider drop-shadow-md">${info.score || '...'}</div>
                        <div class="text-[9px] text-slate-400 mt-1 text-right">👨‍⚖️ 主裁: ${info.referee || '未知'}</div>
                    </div>
                ` : `<div class="mt-2 pt-2 border-t border-slate-700 text-xs text-slate-500 italic text-center py-2">无进行中对局</div>`;

                courtsHtml += `
                <div class="w-[300px] shrink-0 flex flex-col bg-slate-900/80 rounded-2xl border ${isLive ? 'border-emerald-500/50 shadow-[0_0_15px_rgba(16,185,129,0.1)]' : 'border-slate-700'} shadow-xl h-full max-h-full">
                    <div class="p-4 rounded-t-2xl shrink-0 ${headerClass}">
                        <div class="flex justify-between items-start">
                            <h3 class="font-black text-white text-lg tracking-wider"># ${c} 场</h3>
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded ${isLive ? 'bg-emerald-500 text-slate-900 animate-pulse' : 'bg-slate-700 text-slate-400'}">${info.status}</span>
                        </div>
                        ${liveInfoHtml}
                    </div>
                    
                    <div class="flex-grow overflow-y-auto kanban-scroll p-2 drop-zone flex flex-col gap-2 relative" 
                         ondrop="drop(event, '${c}')" 
                         ondragover="allowDrop(event)">
                        
                        <div class="sticky top-0 text-[10px] text-slate-500 font-bold mb-1 flex justify-between bg-slate-900/90 py-1 z-10 backdrop-blur-sm">
                            <span>排队列阵 (Queue)</span>
                            <span class="bg-slate-800 px-1.5 rounded">${cTasks.length}</span>
                        </div>
                        
                        ${cTasks.map(createMatchCardHTML).join('')}
                    </div>
                </div>`;
            }

            document.getElementById('courtsContainer').innerHTML = courtsHtml;
        }

        // ==========================================
        // 🚀 HTML5 原生 Drag and Drop
        // ==========================================

        window.dragStart = (ev, matchId) => {
            isDragging = true;
            ev.dataTransfer.setData("matchId", matchId);
            ev.target.classList.add('dragging');
            setTimeout(() => ev.target.style.display = 'none', 0);
        };

        window.dragEnd = (ev) => {
            isDragging = false;
            ev.target.classList.remove('dragging');
            ev.target.style.display = 'block';
            document.querySelectorAll('.drop-zone').forEach(z => z.classList.remove('drag-over'));
            fetchDashboardData();
        };

        window.allowDrop = (ev) => {
            ev.preventDefault();
            let dropZone = ev.target.closest('.drop-zone');
            if (dropZone) {
                document.querySelectorAll('.drop-zone').forEach(z => z.classList.remove('drag-over'));
                dropZone.classList.add('drag-over');
            }
        };

        window.drop = async (ev, targetCourt) => {
            ev.preventDefault();
            isDragging = false;
            let dropZone = ev.target.closest('.drop-zone');
            if (dropZone) dropZone.classList.remove('drag-over');

            let matchId = ev.dataTransfer.getData("matchId");
            if (!matchId) return;

            let targetName = targetCourt === '' ? '待办提取池' : `#${targetCourt} 场`;
            showToast(`正在将 [${matchId}] 极速调往 ${targetName}...`);

            try {
                const res = await fetch(API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'update_task_court',
                        event_code: eventCode,
                        match_id: matchId,
                        court: targetCourt
                    })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    showToast(`✅ 调度成功！`);
                } else {
                    showToast(`调度失败: ${data.message}`, true);
                }
            } catch (e) {
                showToast(`网络通信中断，调度未送达后端`, true);
            }

            fetchDashboardData();
        };
    </script>
</body>
</html>
