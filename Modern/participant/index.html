<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TOP · Participant readiness</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav id="operator-navigation" class="operator-navigation" aria-label="Authenticated operator navigation"></nav>
  <main data-authenticated-workspace hidden>
    <header><span class="brand">TOP</span><span class="eyebrow">Participant readiness</span><h1>Ready for your tournament?</h1><p>Check your arrival status and check in through Tournament Operations.</p></header>
    <form id="context-form" class="context">
      <label>Competition ID<input name="competitionId" value="1" inputmode="numeric" required></label>
      <button>View readiness</button>
    </form>
    <p id="notice" class="notice">Enter your tournament details to view readiness.</p>
    <section id="readiness" aria-live="polite"><div class="empty">Your authoritative readiness status will appear here.</div></section>
    <footer>Check-in status is managed by Tournament Operations.</footer>
  </main>
  <link rel="stylesheet" href="/shell/navigation.css"><script src="/shell/responsibility-context.js"></script><script src="/shell/operator-shell.js"></script><script src="/shell/navigation.js"></script><script src="api-client.js"></script><script src="readiness-workflow.js"></script><script src="app.js"></script>
</body>
</html>
