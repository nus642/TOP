name: modern-field-test-v1

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        BUILD_ID: ${BUILD_ID:?Set BUILD_ID to the exact 40-hex source commit being built}
    environment:
      NODE_ENV: production
      TOP_ENVIRONMENT: field-test
      TOP_ENVIRONMENT_ID: ${TOP_ENVIRONMENT_ID:?Set an explicit field-test environment ID}
      TOP_FIELD_TEST_ACKNOWLEDGEMENT: ${TOP_FIELD_TEST_ACKNOWLEDGEMENT:?Acknowledge MODERN-FIELD-TEST-V1}
      PORT: "3000"
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_DB: ${MYSQL_DB:?Set a dedicated non-production database name}
      MYSQL_USER: ${MYSQL_USER:?Set a dedicated non-root database user}
      MYSQL_PASS: ${MYSQL_PASS:?Set a unique field-test database password}
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-3000}:3000"
    volumes:
      - ./evidence:/app/rehearsal/evidence
    depends_on:
      db:
        condition: service_healthy
    networks:
      - field-test
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DB:?Set a dedicated non-production database name}
      MYSQL_USER: ${MYSQL_USER:?Set a dedicated non-root database user}
      MYSQL_PASSWORD: ${MYSQL_PASS:?Set a unique field-test database password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASS:?Set a unique field-test root password}
    volumes:
      - field-test-db:/var/lib/mysql
      - ../../db.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u \"$$MYSQL_USER\" --password=\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - field-test
    restart: unless-stopped

volumes:
  field-test-db:
    name: modern-field-test-v1-db

networks:
  field-test:
    name: modern-field-test-v1
    driver: bridge
