<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>比赛记分牌</title>
  <link rel="stylesheet" href="/public/styles.css">
</head>
<body>
  <header class="hero">
    <nav><a class="brand" href="/public"><span>TOP</span> 比赛日</a><span class="live-label">公开记分牌</span></nav>
    <div class="hero-content">
      <div><p class="kicker">场边实况</p><h1 id="competition-label">查找比赛</h1><p class="intro">直接查看赛事系统发布的赛程、比分和已确认赛果。</p></div>
      <form id="competition-form">
        <label for="competition-id">比赛编号</label>
        <div class="form-row"><input id="competition-id" name="competitionId" type="number" min="1" required placeholder="例如：12"><button type="submit">查看比赛</button></div>
      </form>
    </div>
  </header>
  <main>
    <div class="scoreboard-heading"><div><p class="section-label">比赛中心</p><p id="notice" class="notice" role="status">输入比赛编号以查看对局。</p></div><button id="refresh" class="refresh" type="button">↻ 刷新</button></div>
    <section id="matches" class="matches" aria-live="polite"><div class="empty"><strong>准备就绪。</strong><p>请在上方选择比赛以打开公开记分牌。</p></div></section>
  </main>
  <footer>比分和比赛状态由赛事系统提供。</footer>
  <script src="/public/api-client.js"></script><script src="/public/scoreboard.js"></script><script src="/public/app.js"></script>
</body>
</html>
