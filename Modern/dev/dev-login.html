<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>TOP · 开发登录</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 80px auto; padding: 0 20px; }
  h1 { font-size: 1.4rem; }
  label { display: block; margin: 12px 0 4px; font-weight: 600; }
  input, select { width: 100%; padding: 8px; font-size: 1rem; box-sizing: border-box; }
  button { margin-top: 16px; padding: 10px 24px; font-size: 1rem; background: #c0694b; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  button:hover { background: #a85a3f; }
  #status { margin-top: 16px; padding: 12px; border-radius: 6px; display: none; }
  #status.ok { display: block; background: #e6f9ee; color: #1a7a42; }
  #status.err { display: block; background: #fde8e8; color: #c0392b; }
</style>
</head>
<body>
  <h1>TOP 开发环境登录</h1>
  <p>此页面仅用于本地开发，通过服务器 HttpOnly cookie 建立会话。</p>

  <label>Actor ID</label>
  <input id="actorId" value="master-001" placeholder="master-001">

  <label>角色</label>
  <select id="actorType">
    <option value="master" selected>Master（主控）</option>
    <option value="referee">Referee（裁判）</option>
    <option value="participant">Participant（选手）</option>
  </select>

  <button id="loginBtn">登录并跳转</button>
  <div id="status"></div>

  <script>
    document.getElementById('loginBtn').addEventListener('click', async () => {
      const status = document.getElementById('status');
      status.className = '';
      status.style.display = 'none';

      const body = {
        actorId: document.getElementById('actorId').value.trim(),
        actorType: document.getElementById('actorType').value
      };

      try {
        const res = await fetch('/api/session/foundation-establish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(body)
        });

        if (!res.ok) {
          const text = await res.text();
          status.textContent = '登录失败: ' + text;
          status.className = 'err';
          return;
        }

        // 验证会话是否生效
        const me = await fetch('/api/session/me', { credentials: 'include' });
        if (me.ok) {
          const who = await me.json();
          status.textContent = '已登录: ' + who.actorId + ' (' + who.actorType + ')，正在跳转...';
          status.className = 'ok';
          setTimeout(() => {
            window.location.href = '/operator/master.html?competitionId=1';
          }, 800);
        } else {
          status.textContent = '会话建立但验证失败，请刷新重试';
          status.className = 'err';
        }
      } catch (e) {
        status.textContent = '网络错误: ' + e.message;
        status.className = 'err';
      }
    });
  </script>
</body>
</html>
